<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>CuadraTech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f5f7fb;
      --primary: #2563eb;
      --accent: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #111827;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      padding-bottom: 64px;
    }

    header {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    header span {
      font-size: 12px;
      color: var(--muted);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 80px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .card-value {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .card.green { border-left: 4px solid var(--accent); }
    .card.blue { border-left: 4px solid var(--primary); }
    .card.orange { border-left: 4px solid var(--warning); }

    .primary-button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 999px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .primary-button:active { transform: scale(0.98); }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      margin-top: 8px;
    }

    .muted {
      font-size: 12px;
      color: var(--muted);
    }

    /* Productos */
    .search-bar {
      width: 100%;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      font-size: 14px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 64px;
    }

    .product-card {
      background: var(--card);
      border-radius: 10px;
      padding: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .product-image {
      width: 100%;
      height: 70px;
      border-radius: 8px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
    }

    .product-name {
      font-size: 13px;
      font-weight: 600;
    }

    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .stock-pill {
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      color: white;
    }

    .stock-high { background: var(--accent); }
    .stock-mid { background: var(--warning); }
    .stock-low { background: var(--danger); }
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>CuadraTech</h1>
        <span>Control rápido de inventario y ventas</span>
      </div>
      <span>Offline</span>
    </header>

    <main>

      <!-- 🏠 INICIO -->
      <section id="screen-home" class="screen active">
        <div class="cards">
          <div class="card green" id="card-caja">
            <div class="card-title">Caja actual</div>
            <div class="card-value" id="caja-valor">$0.00</div>
            <div class="card-sub">Suma de todas las ventas</div>
          </div>

          <div class="card orange" id="card-inventario">
            <div class="card-title">Inventario total</div>
            <div class="card-value" id="inventario-valor">$0.00</div>
            <div class="card-sub">Valor de stock</div>
          </div>

          <div class="card blue" id="card-ganancia-dia">
            <div class="card-title">Ganancia del día</div>
            <div class="card-value" id="ganancia-dia-valor">$0.00</div>
            <div class="card-sub">Ventas - costo</div>
          </div>
        </div>

        <button class="primary-button" onclick="goToScreen('sales')">
          Nueva venta
        </button>
      </section>
      <!-- 📦 PRODUCTOS -->
      <section id="screen-products" class="screen">
        <div class="section-title">Inventario</div>

        <input 
          type="text" 
          class="search-bar" 
          placeholder="Buscar..." 
          oninput="filterProducts(this.value)" 
        />

        <div class="products-grid" id="products-grid"></div>
      </section>
      <!-- 💵 VENTAS -->
      <section id="screen-sales" class="screen">

        <input 
          type="text" 
          class="search-bar" 
          placeholder="Buscar producto..." 
          oninput="filterSalesProducts(this.value)" 
        />

        <div class="sales-grid" id="sales-grid"></div>

        <div class="cart">
          <div class="cart-header">
            <span>Carrito</span>
            <span class="muted" id="cart-count">0 productos</span>
          </div>

          <div class="cart-items" id="cart-items"></div>

          <div class="cart-total-row">
            <div>
              <div class="muted">Total</div>
              <div id="cart-total">$0.00</div>
            </div>

            <button class="pay-button" onclick="confirmSale()">
              Cobrar
            </button>
          </div>
        </div>

      </section>
      <!-- 📊 HISTORIAL -->
      <section id="screen-history" class="screen">
        <div class="section-title">Historial</div>
        <div id="history-list"></div>

        <div id="history-detail" style="display:none;">
          <h3>Detalle</h3>
          <div id="history-products"></div>
        </div>
      </section>

      <!-- ⚙️ AJUSTES -->
      <section id="screen-settings" class="screen">
        <div class="section-title">Ajustes</div>

        <div class="settings-group">
          <h3>Nombre del negocio</h3>
          <input 
            id="business-name" 
            type="text" 
            placeholder="Ej: Bodega La Esquina" 
            oninput="updateBusinessName(this.value)" 
          />
        </div>

        <div class="settings-group">
          <h3>Reset</h3>
          <button class="danger-button" onclick="openResetModal()">
            Borrar datos
          </button>
        </div>
      </section>

    </main>

    <!-- Botón flotante -->
    <button class="fab" onclick="openProductForm()">+</button>

    <!-- Bottom bar -->
    <nav class="bottom-bar">
      <div class="tab-button active" id="tab-home" onclick="goToScreen('home')">🏠 Inicio</div>
      <div class="tab-button" id="tab-products" onclick="goToScreen('products')">📦 Productos</div>
      <div class="tab-button" id="tab-sales" onclick="goToScreen('sales')">💵 Ventas</div>
      <div class="tab-button" id="tab-history" onclick="goToScreen('history')">📊 Historial</div>
      <div class="tab-button" id="tab-settings" onclick="goToScreen('settings')">⚙️ Ajustes</div>
    </nav>

    <!-- Modal -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h2 id="modal-title">Confirmar</h2>
        <p id="modal-message">¿Seguro?</p>

        <div class="modal-actions">
          <button class="secondary-button" onclick="closeModal()">Cancelar</button>
          <button class="primary-button" id="modal-confirm">Confirmar</button>
        </div>
      </div>
    </div>

  </div>
  <!-- JAVASCRIPT -->
  <script>
    let products = [
      { id: 1, nombre: "Agua 500ml", precio_compra: 0.30, precio_venta: 0.75, stock: 40 },
      { id: 2, nombre: "Refresco lata", precio_compra: 0.50, precio_venta: 1.20, stock: 15 },
      { id: 3, nombre: "Pan", precio_compra: 0.20, precio_venta: 0.60, stock: 5 },
      { id: 4, nombre: "Galletas", precio_compra: 0.40, precio_venta: 1.00, stock: 25 }
    ];

    let ventas = [];
    let cart = [];
    let businessName = "CuadraTech";

    function formatMoney(v) { return "$" + v.toFixed(2); }

    function goToScreen(screen) {
      const screens = {
        home: "screen-home",
        products: "screen-products",
        sales: "screen-sales",
        history: "screen-history",
        settings: "screen-settings",
      };

      Object.values(screens).forEach(id => {
        document.getElementById(id).classList.remove("active");
      });
      document.getElementById(screens[screen]).classList.add("active");

      ["home","products","sales","history","settings"].forEach(tab => {
        document.getElementById("tab-" + tab).classList.remove("active");
      });
      document.getElementById("tab-" + screen).classList.add("active");

      if (screen === "products") renderProducts();
      if (screen === "sales") renderSalesProducts();
      if (screen === "history") renderHistory();
      if (screen === "home") updateDashboard();
    }

    function updateDashboard() {
      const caja = ventas.reduce((acc, v) => acc + v.total, 0);
      document.getElementById("caja-valor").textContent = formatMoney(caja);

      const inventario = products.reduce((acc, p) => acc + p.precio_compra * p.stock, 0);
      document.getElementById("inventario-valor").textContent = formatMoney(inventario);

      let totalVentas = 0;
      let costoVendidos = 0;

      ventas.forEach(v => {
        totalVentas += v.total;
        v.items.forEach(i => costoVendidos += i.costo_unitario * i.cantidad);
      });

      const ganancia = totalVentas - costoVendidos;
      document.getElementById("ganancia-dia-valor").textContent = formatMoney(ganancia);
    }

    function stockLevelClass(stock) {
      if (stock >= 20) return "stock-high";
      if (stock >= 10) return "stock-mid";
      return "stock-low";
    }

    function renderProducts() {
      const grid = document.getElementById("products-grid");
      grid.innerHTML = "";

      products.forEach(p => {
        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
          <div class="product-image">IMG</div>
          <div class="product-name">${p.nombre}</div>
          <div class="product-row">
            <span>${formatMoney(p.precio_venta)}</span>
            <span class="stock-pill ${stockLevelClass(p.stock)}">${p.stock}</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function filterProducts(text) {
      const grid = document.getElementById("products-grid");
      grid.innerHTML = "";

      products
        .filter(p => p.nombre.toLowerCase().includes(text.toLowerCase()))
        .forEach(p => {
          const div = document.createElement("div");
          div.className = "product-card";
          div.innerHTML = `
            <div class="product-image">IMG</div>
            <div class="product-name">${p.nombre}</div>
            <div class="product-row">
              <span>${formatMoney(p.precio_venta)}</span>
              <span class="stock-pill ${stockLevelClass(p.stock)}">${p.stock}</span>
            </div>
          `;
          grid.appendChild(div);
        });
    }

    function renderSalesProducts() {
      const grid = document.getElementById("sales-grid");
      grid.innerHTML = "";

      products.forEach(p => {
        const div = document.createElement("div");
        div.className = "product-card";
        div.onclick = () => addToCart(p.id);

        div.innerHTML = `
          <div class="product-image">IMG</div>
          <div class="product-name">${p.nombre}</div>
          <div class="product-row">
            <span>${formatMoney(p.precio_venta)}</span>
            <span class="stock-pill ${stockLevelClass(p.stock)}">${p.stock}</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function filterSalesProducts(text) {
      const grid = document.getElementById("sales-grid");
      grid.innerHTML = "";

      products
        .filter(p => p.nombre.toLowerCase().includes(text.toLowerCase()))
        .forEach(p => {
          const div = document.createElement("div");
          div.className = "product-card";
          div.onclick = () => addToCart(p.id);

          div.innerHTML = `
            <div class="product-image">IMG</div>
            <div class="product-name">${p.nombre}</div>
            <div class="product-row">
              <span>${formatMoney(p.precio_venta)}</span>
              <span class="stock-pill ${stockLevelClass(p.stock)}">${p.stock}</span>
            </div>
          `;
          grid.appendChild(div);
        });
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product || product.stock <= 0) return;

      const item = cart.find(i => i.id === id);
      if (item) item.cantidad++;
      else cart.push({ id, cantidad: 1 });

      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cart-items");
      container.innerHTML = "";

      let total = 0;
      let count = 0;

      cart.forEach(item => {
        const p = products.find(pr => pr.id === item.id);
        const subtotal = p.precio_venta * item.cantidad;
        total += subtotal;
        count += item.cantidad;

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <div class="cart-item-info">
            <strong>${p.nombre}</strong>
            <span class="muted">${item.cantidad} x ${formatMoney(p.precio_venta)}</span>
          </div>

          <div class="cart-item-actions">
            <button class="icon-button" onclick="changeQty(${p.id}, -1)">-</button>
            <button class="icon-button" onclick="changeQty(${p.id}, 1)">+</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById("cart-total").textContent = formatMoney(total);
      document.getElementById("cart-count").textContent = count + " productos";
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.cantidad += delta;
      if (item.cantidad <= 0) {
        cart = cart.filter(i => i.id !== id);
      }

      renderCart();
    }

    function confirmSale() {
      if (cart.length === 0) return;

      openModal(
        "Confirmar venta",
        "¿Deseas completar esta venta?",
        () => completeSale()
      );
    }

    function completeSale() {
      let total = 0;
      const items = [];

      cart.forEach(item => {
        const p = products.find(pr => pr.id === item.id);
        total += p.precio_venta * item.cantidad;

        items.push({
          nombre: p.nombre,
          cantidad: item.cantidad,
          precio_unitario: p.precio_venta,
          costo_unitario: p.precio_compra
        });

        p.stock -= item.cantidad;
      });

      ventas.push({
        id: ventas.length + 1,
        fecha: new Date().toLocaleString(),
        total,
        items
      });

      cart = [];
      renderCart();
      renderSalesProducts();
      updateDashboard();
      closeModal();
    }

    function renderHistory() {
      const list = document.getElementById("history-list");
      list.innerHTML = "";

      ventas.forEach(v => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.onclick = () => showHistoryDetail(v.id);

        const badge = v.total >= 10 ? "🟢" : v.total >= 5 ? "🟡" : "🔴";

        div.innerHTML = `
          <div>
            <strong>Venta #${v.id}</strong><br>
            <span class="muted">${v.fecha}</span>
          </div>
          <div class="history-badge">${badge}</div>
        `;
        list.appendChild(div);
      });
    }

    function showHistoryDetail(id) {
      const v = ventas.find(x => x.id === id);
      if (!v) return;

      const container = document.getElementById("history-products");
      container.innerHTML = "";

      v.items.forEach(i => {
        const div = document.createElement("div");
        div.innerHTML = `
          <strong>${i.nombre}</strong> — ${i.cantidad} x ${formatMoney(i.precio_unitario)}
        `;
        container.appendChild(div);
      });

      document.getElementById("history-detail").style.display = "block";
    }

    function updateBusinessName(name) {
      businessName = name;
    }

    function openResetModal() {
      openModal(
        "Borrar datos",
        "¿Seguro que deseas borrar inventario, ventas y ajustes?",
        () => resetAll()
      );
    }

    function resetAll() {
      products = [];
      ventas = [];
      cart = [];
      renderProducts();
      renderSalesProducts();
      renderCart();
      renderHistory();
      updateDashboard();
      closeModal();
    }

    function openModal(title, message, onConfirm) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-message").textContent = message;

      const btn = document.getElementById("modal-confirm");
      btn.onclick = onConfirm;

      document.getElementById("modal-backdrop").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal-backdrop").style.display = "none";
    }

    function openProductForm() {
      alert("Formulario de producto próximamente");
    }
  </script>

</body>
</html>
